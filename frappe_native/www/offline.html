<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>You're Offline</title>
	<style>
		*,
		*::before,
		*::after {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
			background: linear-gradient(135deg, #0c0d13 0%, #1a1b2e 50%, #0c0d13 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #e2e8f0;
			overflow: hidden;
		}

		.offline-container {
			text-align: center;
			padding: 3rem 2rem;
			max-width: 480px;
			position: relative;
			z-index: 1;
		}

		/* Animated signal icon */
		.signal-icon {
			width: 120px;
			height: 120px;
			margin: 0 auto 2rem;
			position: relative;
		}

		.signal-icon svg {
			width: 100%;
			height: 100%;
			filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.3));
		}

		.signal-bar {
			fill: none;
			stroke: #6366f1;
			stroke-width: 3;
			stroke-linecap: round;
			opacity: 0.3;
			animation: pulse-bar 2s ease-in-out infinite;
		}

		.signal-bar:nth-child(1) { animation-delay: 0s; }
		.signal-bar:nth-child(2) { animation-delay: 0.3s; }
		.signal-bar:nth-child(3) { animation-delay: 0.6s; }

		.signal-x {
			stroke: #ef4444;
			stroke-width: 3;
			stroke-linecap: round;
			animation: draw-x 1.5s ease-out forwards;
		}

		@keyframes pulse-bar {
			0%, 100% { opacity: 0.2; }
			50% { opacity: 0.6; }
		}

		@keyframes draw-x {
			0% { stroke-dashoffset: 30; opacity: 0; }
			50% { opacity: 1; }
			100% { stroke-dashoffset: 0; opacity: 1; }
		}

		h1 {
			font-size: 1.75rem;
			font-weight: 700;
			margin-bottom: 0.75rem;
			background: linear-gradient(135deg, #818cf8, #c084fc);
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		p {
			font-size: 1rem;
			color: #94a3b8;
			line-height: 1.6;
			margin-bottom: 2rem;
		}

		.retry-btn {
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
			padding: 0.875rem 2rem;
			background: linear-gradient(135deg, #6366f1, #8b5cf6);
			color: white;
			border: none;
			border-radius: 12px;
			font-size: 1rem;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.3s ease;
			box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
		}

		.retry-btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
		}

		.retry-btn:active {
			transform: translateY(0);
		}

		.retry-btn svg {
			width: 18px;
			height: 18px;
			transition: transform 0.3s ease;
		}

		.retry-btn:hover svg {
			transform: rotate(180deg);
		}

		.status-badge {
			display: inline-flex;
			align-items: center;
			gap: 0.5rem;
			padding: 0.5rem 1rem;
			background: rgba(239, 68, 68, 0.1);
			border: 1px solid rgba(239, 68, 68, 0.2);
			border-radius: 999px;
			font-size: 0.8rem;
			color: #fca5a5;
			margin-bottom: 2rem;
		}

		.status-dot {
			width: 8px;
			height: 8px;
			background: #ef4444;
			border-radius: 50%;
			animation: blink 1.5s infinite;
		}

		@keyframes blink {
			0%, 100% { opacity: 1; }
			50% { opacity: 0.3; }
		}

		/* Background decoration */
		.bg-glow {
			position: fixed;
			width: 400px;
			height: 400px;
			border-radius: 50%;
			filter: blur(100px);
			opacity: 0.1;
			pointer-events: none;
		}

		.bg-glow-1 {
			top: -100px;
			right: -100px;
			background: #6366f1;
		}

		.bg-glow-2 {
			bottom: -100px;
			left: -100px;
			background: #8b5cf6;
		}
	</style>
</head>
<body>
	<div class="bg-glow bg-glow-1"></div>
	<div class="bg-glow bg-glow-2"></div>

	<div class="offline-container">
		<div class="signal-icon">
			<svg viewBox="0 0 100 100">
				<!-- WiFi signal bars -->
				<path class="signal-bar" d="M50 80 Q30 60 20 50" />
				<path class="signal-bar" d="M50 80 Q35 50 15 35" />
				<path class="signal-bar" d="M50 80 Q40 40 10 20" />
				<path class="signal-bar" d="M50 80 Q70 60 80 50" />
				<path class="signal-bar" d="M50 80 Q65 50 85 35" />
				<path class="signal-bar" d="M50 80 Q60 40 90 20" />
				<!-- X mark -->
				<line class="signal-x" x1="35" y1="30" x2="65" y2="60" stroke-dasharray="30" stroke-dashoffset="30" />
				<line class="signal-x" x1="65" y1="30" x2="35" y2="60" stroke-dasharray="30" stroke-dashoffset="30" />
				<!-- Center dot -->
				<circle cx="50" cy="80" r="4" fill="#6366f1" />
			</svg>
		</div>

		<div class="status-badge">
			<span class="status-dot"></span>
			No Internet Connection
		</div>

		<h1>You're Offline</h1>
		<p>
			It looks like you've lost your internet connection.
			Don't worry — any cached pages are still available.
			Click retry to reconnect.
		</p>

		<button class="retry-btn" onclick="window.location.reload()">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<polyline points="23,4 23,10 17,10"></polyline>
				<path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
			</svg>
			Retry Connection
		</button>
	</div>

	<script>
		// Auto-retry when connection is restored
		window.addEventListener('online', () => {
			window.location.reload();
		});
	</script>
</body>
</html>
